<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hefesto 🔥</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0d0d12; font-family: -apple-system, 'Segoe UI', sans-serif; color: #e0e0e0; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ===== LOGIN ===== */
  #login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; gap: 14px; }
  .logo-login { font-size: 54px; animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 6px rgba(255,100,0,.5)); } 50% { filter: drop-shadow(0 0 18px rgba(255,150,0,1)); } }
  #login h1 { color: #ff7a00; font-size: 22px; letter-spacing: 3px; margin-bottom: 4px; }
  #login p { color: rgba(255,255,255,.4); font-size: 12px; margin-bottom: 14px; }
  #login input {
    width: 100%; max-width: 300px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none;
  }
  #login input:focus { border-color: rgba(255,120,0,.6); }
  #login button {
    width: 100%; max-width: 300px; background: linear-gradient(135deg,#ff6b00,#ff9500); border: none;
    border-radius: 10px; padding: 13px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,100,0,.35);
  }
  #login-erro { color: #ff6b6b; font-size: 12px; min-height: 16px; }

  /* ===== HEADER ===== */
  #hdr { background: linear-gradient(135deg,#1a1a24,#12121a); border-bottom: 1px solid rgba(255,120,0,.2);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-h { font-size: 24px; }
  .hi { flex: 1; }
  .hn { font-size: 15px; font-weight: 700; color: #ff7a00; }
  .hs { font-size: 11px; color: rgba(255,255,255,.4); }
  #sair { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 8px;
    padding: 6px 10px; color: rgba(255,255,255,.5); font-size: 12px; cursor: pointer; }

  /* ===== TABS ===== */
  #tabs { display: flex; background: rgba(0,0,0,.3); border-bottom: 1px solid rgba(255,255,255,.05); flex-shrink: 0; }
  .tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 20px; color: rgba(255,255,255,.35);
    cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab.on { color: #ff7a00; border-bottom-color: #ff7a00; }

  .pnl { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .pnl.on { display: flex; }

  /* ===== CHAT ===== */
  #msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .m { display: flex; gap: 8px; animation: fi .2s ease; }
  @keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .m.u { flex-direction: row-reverse; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .m.ia .av { background: rgba(255,120,0,.2); }
  .m.u .av { background: rgba(100,150,255,.2); }
  .mb { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .m.ia .mb { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 4px 14px 14px 14px; }
  .m.u .mb { background: linear-gradient(135deg, rgba(255,100,0,.22), rgba(255,150,0,.15)); border: 1px solid rgba(255,120,0,.3); border-radius: 14px 4px 14px 14px; color: #fff; }
  .mb strong { color: #ffb347; }
  .espera { font-size: 11px; color: rgba(255,255,255,.3); font-style: italic; padding: 2px 0; }

  #inp-area { padding: 10px 12px; background: rgba(0,0,0,.3); border-top: 1px solid rgba(255,255,255,.05); display: flex; gap: 8px; flex-shrink: 0; }
  #inp { flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
    padding: 11px 16px; color: #fff; font-size: 14px; outline: none; }
  #inp:focus { border-color: rgba(255,120,0,.5); }
  .bs { background: linear-gradient(135deg,#ff6b00,#ff9500); border: none; border-radius: 50%; width: 42px; height: 42px;
    cursor: pointer; font-size: 17px; flex-shrink: 0; box-shadow: 0 2px 10px rgba(255,100,0,.4); }

  /* ===== LISTAS ===== */
  .lst { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .ti { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .ti.done { opacity: .4; }
  .ti.done .tt { text-decoration: line-through; }
  .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,120,0,.5);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ti.done .ck { background: #4caf50; border-color: #4caf50; }
  .tt { font-size: 14px; flex: 1; }
  .ni { background: rgba(255,200,0,.05); border: 1px solid rgba(255,200,0,.12); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .vz { text-align: center; color: rgba(255,255,255,.3); font-size: 14px; padding: 40px 20px; }

  .ar { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.05); display: flex; gap: 8px; flex-shrink: 0; }
  .ai { flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
    padding: 10px 16px; color: #fff; font-size: 14px; outline: none; }
  .ab { background: rgba(255,120,0,.2); border: 1px solid rgba(255,120,0,.4); border-radius: 20px;
    padding: 10px 16px; color: #ff7a00; font-size: 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }

  /* ===== BUSCA ===== */
  .br-item { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 12px 14px; margin: 0 14px 8px; }
  .br-titulo { color: #ffb347; font-weight: 600; font-size: 14px; }
  .br-trecho { color: rgba(255,255,255,.5); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>

<div id="app">

  <!-- LOGIN -->
  <div id="login">
    <div class="logo-login">🔥</div>
    <h1>HEFESTO</h1>
    <p>Seu segundo cérebro, em qualquer lugar</p>
    <input type="email" id="email" placeholder="seu email" autocomplete="email">
    <input type="password" id="senha" placeholder="senha" autocomplete="current-password">
    <button onclick="login()">Entrar</button>
    <div id="login-erro"></div>
  </div>

  <!-- APP (escondido até logar) -->
  <div id="main-app" style="display:none; flex-direction:column; height:100%">
    <div id="hdr">
      <span class="logo-h">🔥</span>
      <div class="hi">
        <div class="hn">Hefesto</div>
        <div class="hs" id="hs">conectando...</div>
      </div>
      <button id="sair" onclick="sair()">Sair</button>
    </div>

    <div id="tabs">
      <div class="tab on" onclick="tab('chat',this)">💬</div>
      <div class="tab" onclick="tab('tar',this)">📋</div>
      <div class="tab" onclick="tab('nota',this)">📝</div>
      <div class="tab" onclick="tab('busca',this)">🔍</div>
    </div>

    <!-- CHAT -->
    <div class="pnl on" id="tab-chat">
      <div id="msgs">
        <div class="m ia"><div class="av">🔥</div><div class="mb">Olá! Sou o <strong>Hefesto</strong>. Suas mensagens aqui são respondidas pelo seu PC (precisa estar ligado e com o Hefesto rodando).</div></div>
      </div>
      <div id="inp-area">
        <input id="inp" placeholder="Fale com o Hefesto...">
        <button class="bs" onclick="enviar()">⚡</button>
      </div>
    </div>

    <!-- TAREFAS -->
    <div class="pnl" id="tab-tar">
      <div class="lst" id="lst-tar"></div>
      <div class="ar">
        <input class="ai" id="ni-tar" placeholder="Nova tarefa...">
        <button class="ab" onclick="addTar()">+ Add</button>
      </div>
    </div>

    <!-- NOTAS -->
    <div class="pnl" id="tab-nota">
      <div class="lst" id="lst-nota"></div>
      <div class="ar">
        <input class="ai" id="ni-nota" placeholder="Nova nota...">
        <button class="ab" onclick="addNota()">+ Add</button>
      </div>
    </div>

    <!-- BUSCA -->
    <div class="pnl" id="tab-busca">
      <div class="ar" style="border-top:none; border-bottom:1px solid rgba(255,255,255,.05)">
        <input class="ai" id="q-busca" placeholder="Pesquisar no vault...">
        <button class="ab" onclick="buscar()">🔍</button>
      </div>
      <div class="lst" id="busca-res"><div class="vz">Digite algo para buscar no vault</div></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://tlhjobskstfcytgulicd.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_8VJnvD-FvATS2YcQ_KCkyw_qxYzs9Et'
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    db: { schema: 'hefesto' },
    auth: { persistSession: true, autoRefreshToken: true }
  })

  let OWNER = null
  let pollingMsg = null

  // ── LOGIN ──
  async function login() {
    const email = document.getElementById('email').value.trim()
    const senha = document.getElementById('senha').value
    const erroEl = document.getElementById('login-erro')
    erroEl.textContent = ''
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha })
    if (error) { erroEl.textContent = '❌ ' + error.message; return }
    OWNER = data.user.id
    document.getElementById('login').style.display = 'none'
    document.getElementById('main-app').style.display = 'flex'
    document.getElementById('hs').textContent = 'conectado ✅'
    carregarTudo()
  }

  async function sair() {
    await sb.auth.signOut()
    location.reload()
  }

  // Restaura sessão se já estava logado
  async function tentarRestaurarSessao() {
    const { data } = await sb.auth.getSession()
    if (data.session) {
      OWNER = data.session.user.id
      document.getElementById('login').style.display = 'none'
      document.getElementById('main-app').style.display = 'flex'
      document.getElementById('hs').textContent = 'conectado ✅'
      carregarTudo()
    }
  }
  tentarRestaurarSessao()

  // ── TABS ──
  function tab(nome, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'))
    el.classList.add('on')
    document.querySelectorAll('.pnl').forEach(p => p.classList.remove('on'))
    document.getElementById('tab-' + nome).classList.add('on')
    if (nome === 'tar') carregarTarefas()
    if (nome === 'nota') carregarNotas()
  }

  function carregarTudo() { carregarTarefas(); carregarNotas() }

  // ── CHAT (via tabela mensagens_pendentes, respondida pelo PC) ──
  async function enviar() {
    const inp = document.getElementById('inp')
    const txt = inp.value.trim()
    if (!txt) return
    inp.value = ''
    addMsg(txt, 'u')
    const { data, error } = await sb.from('mensagens_pendentes').insert({ texto: txt, owner: OWNER }).select().single()
    if (error) { addMsg('❌ Erro ao enviar: ' + error.message, 'ia'); return }
    const esperaEl = document.createElement('div')
    esperaEl.className = 'espera'
    esperaEl.textContent = '⏳ Aguardando o PC responder...'
    document.getElementById('msgs').appendChild(esperaEl)
    document.getElementById('msgs').scrollTop = 99999
    aguardarResposta(data.id, esperaEl)
  }

  async function aguardarResposta(id, esperaEl) {
    let tentativas = 0
    const intervalo = setInterval(async () => {
      tentativas++
      const { data } = await sb.from('mensagens_pendentes').select('respondida,resposta').eq('id', id).single()
      if (data && data.respondida) {
        clearInterval(intervalo)
        esperaEl.remove()
        addMsg(data.resposta, 'ia')
      }
      if (tentativas > 40) { // ~2 minutos
        clearInterval(intervalo)
        esperaEl.textContent = '⚠️ O PC não respondeu. Ele está ligado e com o Hefesto aberto?'
      }
    }, 3000)
  }

  function addMsg(txt, tipo) {
    const c = document.getElementById('msgs')
    const d = document.createElement('div')
    d.className = `m ${tipo}`
    d.innerHTML = `<div class="av">${tipo==='ia'?'🔥':'👤'}</div><div class="mb">${txt.replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</div>`
    c.appendChild(d); c.scrollTop = c.scrollHeight
  }

  document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') enviar() })
  document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') login() })

  // ── TAREFAS ──
  async function carregarTarefas() {
    const { data } = await sb.from('tarefas').select('*').order('criada', { ascending: false })
    const lst = document.getElementById('lst-tar')
    if (!data || !data.length) { lst.innerHTML = '<div class="vz">✅ Nenhuma tarefa ainda!</div>'; return }
    lst.innerHTML = ''
    data.forEach(t => {
      const div = document.createElement('div')
      div.className = `ti${t.concluida ? ' done' : ''}`
      div.innerHTML = `<div class="ck">${t.concluida ? '✓' : ''}</div><div class="tt">${t.texto}</div>`
      if (!t.concluida) div.onclick = async () => {
        await sb.from('tarefas').update({ concluida: true, concluida_em: new Date().toISOString() }).eq('id', t.id)
        carregarTarefas()
      }
      lst.appendChild(div)
    })
  }

  async function addTar() {
    const inp = document.getElementById('ni-tar')
    const txt = inp.value.trim(); if (!txt) return
    await sb.from('tarefas').insert({ texto: txt, owner: OWNER })
    inp.value = ''; carregarTarefas()
  }
  document.getElementById('ni-tar').addEventListener('keydown', e => { if (e.key === 'Enter') addTar() })

  // ── NOTAS ──
  async function carregarNotas() {
    const { data } = await sb.from('notas').select('*').order('criada', { ascending: false }).limit(30)
    const lst = document.getElementById('lst-nota')
    if (!data || !data.length) { lst.innerHTML = '<div class="vz">📝 Nenhuma nota ainda.</div>'; return }
    lst.innerHTML = ''
    data.forEach(n => {
      const div = document.createElement('div'); div.className = 'ni'
      div.textContent = n.texto
      lst.appendChild(div)
    })
  }

  async function addNota() {
    const inp = document.getElementById('ni-nota')
    const txt = inp.value.trim(); if (!txt) return
    await sb.from('notas').insert({ texto: txt, owner: OWNER })
    inp.value = ''; carregarNotas()
  }
  document.getElementById('ni-nota').addEventListener('keydown', e => { if (e.key === 'Enter') addNota() })

  // ── BUSCA VAULT ──
  async function buscar() {
    const q = document.getElementById('q-busca').value.trim(); if (!q) return
    const res = document.getElementById('busca-res')
    res.innerHTML = '<div class="vz">🔍 Buscando...</div>'
    const { data, error } = await sb.from('vault_notas').select('caminho,titulo,conteudo').textSearch('conteudo', q.split(' ').join(' & '), { config: 'portuguese' }).limit(10)
    if (error || !data || !data.length) {
      // fallback: busca simples por ilike
      const { data: data2 } = await sb.from('vault_notas').select('caminho,titulo,conteudo').ilike('conteudo', `%${q}%`).limit(10)
      renderBusca(data2, q)
      return
    }
    renderBusca(data, q)
  }

  function renderBusca(data, q) {
    const res = document.getElementById('busca-res')
    if (!data || !data.length) { res.innerHTML = `<div class="vz">Nada encontrado sobre "${q}"</div>`; return }
    res.innerHTML = ''
    data.forEach(r => {
      const idx = r.conteudo.toLowerCase().indexOf(q.toLowerCase())
      const trecho = idx >= 0 ? r.conteudo.slice(Math.max(0, idx - 40), idx + 100) : r.conteudo.slice(0, 100)
      const div = document.createElement('div'); div.className = 'br-item'
      div.innerHTML = `<div class="br-titulo">📄 ${r.titulo || r.caminho}</div><div class="br-trecho">${trecho}...</div>`
      res.appendChild(div)
    })
  }
  document.getElementById('q-busca').addEventListener('keydown', e => { if (e.key === 'Enter') buscar() })
</script>
</body>
</html>
