<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hefesto</title>
<link rel="icon" href="assets/logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #070708; font-family: 'Segoe UI', -apple-system, sans-serif; color: #d8d8dc; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  :root { --v: #c81e2c; --vc: #e8384a; --cz: #8a8a92; --czc: #d8d8dc; }
  svg { display: block; }
  .ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== LOGIN ===== */
  #login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; gap: 14px;
    background: radial-gradient(circle at 50% 30%, #140608 0%, #070708 70%); }
  .logo-login { width: 92px; height: 92px; border-radius: 50%; filter: drop-shadow(0 0 20px rgba(200,30,44,.45)); margin-bottom: 4px; }
  #login h1 { color: var(--vc); font-size: 20px; letter-spacing: 4px; margin-bottom: 2px; font-weight: 700; }
  #login p { color: var(--cz); font-size: 12px; margin-bottom: 14px; }
  #login input {
    width: 100%; max-width: 300px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none;
  }
  #login input:focus { border-color: rgba(200,30,44,.6); }
  #login button {
    width: 100%; max-width: 300px; background: linear-gradient(135deg,var(--v),#8e1420); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 13px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(200,30,44,.3); letter-spacing: 1px;
  }
  #login-erro { color: var(--vc); font-size: 12px; min-height: 16px; }

  /* ===== HEADER ===== */
  #hdr { background: linear-gradient(135deg,#0d0d10,#15070a); border-bottom: 1px solid rgba(200,30,44,.22);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-h { width: 28px; height: 28px; border-radius: 50%; filter: drop-shadow(0 0 5px rgba(200,30,44,.5)); }
  .hi { flex: 1; }
  .hn { font-size: 14px; font-weight: 700; color: var(--vc); letter-spacing: 1.5px; }
  .hs { font-size: 11px; color: var(--cz); }
  #sair { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 8px;
    padding: 6px 10px; color: var(--cz); font-size: 11px; cursor: pointer; }

  /* ===== TABS ===== */
  #tabs { display: flex; background: rgba(0,0,0,.35); border-bottom: 1px solid rgba(255,255,255,.05); flex-shrink: 0; }
  .tab { flex: 1; padding: 13px 4px; display: flex; align-items: center; justify-content: center;
    color: var(--cz); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab.on { color: var(--vc); border-bottom-color: var(--v); }

  .pnl { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .pnl.on { display: flex; }

  /* ===== CHAT ===== */
  #msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .m { display: flex; gap: 8px; animation: fi .2s ease; }
  @keyframes fi { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .m.u { flex-direction: row-reverse; }
  .av { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .m.ia .av { background: rgba(200,30,44,.14); color: var(--vc); }
  .m.u .av { background: rgba(255,255,255,.06); color: var(--czc); }
  .mb { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .m.ia .mb { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); border-radius: 3px 12px 12px 12px; }
  .m.u .mb { background: linear-gradient(135deg, rgba(200,30,44,.2), rgba(142,20,32,.14)); border: 1px solid rgba(200,30,44,.28); border-radius: 12px 3px 12px 12px; color: #fff; }
  .mb strong { color: var(--vc); }
  .espera { font-size: 11px; color: var(--cz); font-style: italic; padding: 2px 0; }

  #inp-area { padding: 10px 12px; background: rgba(0,0,0,.3); border-top: 1px solid rgba(255,255,255,.05); display: flex; gap: 8px; flex-shrink: 0; }
  #inp { flex: 1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 18px;
    padding: 11px 16px; color: #fff; font-size: 14px; outline: none; }
  #inp:focus { border-color: rgba(200,30,44,.5); }
  .bs { background: linear-gradient(135deg,var(--v),#8e1420); border: 1px solid rgba(255,255,255,.08); border-radius: 50%; width: 42px; height: 42px;
    cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 10px rgba(200,30,44,.35); display: flex; align-items: center; justify-content: center; }
  .bs .ic { stroke: #fff; }

  /* ===== LISTAS ===== */
  .lst { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .ti { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .ti.done { opacity: .4; }
  .ti.done .tt { text-decoration: line-through; }
  .ck { width: 20px; height: 20px; border-radius: 5px; border: 1.6px solid rgba(200,30,44,.5);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
  .ck .ic { width: 12px; height: 12px; }
  .ti.done .ck { background: var(--v); border-color: var(--v); }
  .tt { font-size: 14px; flex: 1; }
  .ni { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .vz { text-align: center; color: rgba(255,255,255,.25); font-size: 14px; padding: 40px 20px; }

  .ar { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.05); display: flex; gap: 8px; flex-shrink: 0; }
  .ai { flex: 1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 18px;
    padding: 10px 16px; color: #fff; font-size: 14px; outline: none; }
  .ab { background: rgba(200,30,44,.15); border: 1px solid rgba(200,30,44,.4); border-radius: 18px;
    padding: 10px 16px; color: var(--vc); font-size: 13px; cursor: pointer; font-weight: 600; white-space: nowrap; }

  /* ===== BUSCA ===== */
  .br-item { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 12px 14px; margin: 0 14px 8px; }
  .br-titulo { color: var(--vc); font-weight: 600; font-size: 14px; }
  .br-trecho { color: var(--cz); font-size: 12px; margin-top: 4px; }
</style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="assets/logo.png">
</head>
<body>

<div id="app">

  <!-- LOGIN -->
  <div id="login">
    <img class="logo-login" src="assets/logo.png" alt="Hefesto">
    <h1>HEFESTO</h1>
    <p>Seu segundo cérebro, em qualquer lugar</p>
    <input type="email" id="email" placeholder="seu email" autocomplete="email">
    <input type="password" id="senha" placeholder="senha" autocomplete="current-password">
    <button onclick="login()">ENTRAR</button>
    <div id="login-erro"></div>
  </div>

  <!-- APP (escondido até logar) -->
  <div id="main-app" style="display:none; flex-direction:column; height:100%">
    <div id="hdr">
      <img class="logo-h" src="assets/logo.png" alt="Hefesto">
      <div class="hi">
        <div class="hn">HEFESTO</div>
        <div class="hs" id="hs">conectando...</div>
      </div>
      <button id="sair" onclick="sair()">Sair</button>
    </div>

    <div id="tabs">
      <div class="tab on" onclick="tab('chat',this)" title="Chat"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
      <div class="tab" onclick="tab('tar',this)" title="Tarefas"><svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
      <div class="tab" onclick="tab('nota',this)" title="Notas"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg></div>
      <div class="tab" onclick="tab('busca',this)" title="Buscar"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></div>
    </div>

    <!-- CHAT -->
    <div class="pnl on" id="tab-chat">
      <div id="msgs">
        <div class="m ia"><div class="av"><svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="mb">Olá. Sou o <strong>Hefesto</strong>. Suas mensagens aqui são respondidas pelo seu PC (precisa estar ligado e com o Hefesto rodando).</div></div>
      </div>
      <div id="inp-area">
        <input id="inp" placeholder="Fale com o Hefesto...">
        <button class="bs" onclick="enviar()"><svg class="ic" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
      </div>
    </div>

    <!-- TAREFAS -->
    <div class="pnl" id="tab-tar">
      <div class="lst" id="lst-tar"></div>
      <div class="ar">
        <input class="ai" id="ni-tar" placeholder="Nova tarefa...">
        <button class="ab" onclick="addTar()">Add</button>
      </div>
    </div>

    <!-- NOTAS -->
    <div class="pnl" id="tab-nota">
      <div class="lst" id="lst-nota"></div>
      <div class="ar">
        <input class="ai" id="ni-nota" placeholder="Nova nota...">
        <button class="ab" onclick="addNota()">Add</button>
      </div>
    </div>

    <!-- BUSCA -->
    <div class="pnl" id="tab-busca">
      <div class="ar" style="border-top:none; border-bottom:1px solid rgba(255,255,255,.05)">
        <input class="ai" id="q-busca" placeholder="Pesquisar no vault...">
        <button class="ab" onclick="buscar()">Buscar</button>
      </div>
      <div class="lst" id="busca-res"><div class="vz">Digite algo para buscar no vault</div></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://tlhjobskstfcytgulicd.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_8VJnvD-FvATS2YcQ_KCkyw_qxYzs9Et'
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  })
  const T = {
    tarefas: 'hefesto_tarefas',
    notas: 'hefesto_notas',
    mensagens: 'hefesto_mensagens_pendentes',
    vault: 'hefesto_vault_notas'
  }

  let OWNER = null

  async function login() {
    const email = document.getElementById('email').value.trim()
    const senha = document.getElementById('senha').value
    const erroEl = document.getElementById('login-erro')
    erroEl.textContent = ''
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha })
    if (error) { erroEl.textContent = error.message; return }
    OWNER = data.user.id
    document.getElementById('login').style.display = 'none'
    document.getElementById('main-app').style.display = 'flex'
    document.getElementById('hs').textContent = 'conectado'
    carregarTudo()
  }

  async function sair() {
    await sb.auth.signOut()
    location.reload()
  }

  async function tentarRestaurarSessao() {
    const { data } = await sb.auth.getSession()
    if (data.session) {
      OWNER = data.session.user.id
      document.getElementById('login').style.display = 'none'
      document.getElementById('main-app').style.display = 'flex'
      document.getElementById('hs').textContent = 'conectado'
      carregarTudo()
    }
  }
  tentarRestaurarSessao()

  function tab(nome, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'))
    el.classList.add('on')
    document.querySelectorAll('.pnl').forEach(p => p.classList.remove('on'))
    document.getElementById('tab-' + nome).classList.add('on')
    if (nome === 'tar') carregarTarefas()
    if (nome === 'nota') carregarNotas()
  }

  function carregarTudo() { carregarTarefas(); carregarNotas(); carregarHistorico() }

  async function carregarHistorico() {
    const { data } = await sb.from('hefesto_chat_historico').select('role,content,ts').order('ts', { ascending: false }).limit(60)
    if (!data || !data.length) return
    const c = document.getElementById('msgs')
    c.innerHTML = ''
    data.reverse().forEach(l => addMsg(l.content, l.role === 'user' ? 'u' : 'ia'))
  }

  async function enviar() {
    const inp = document.getElementById('inp')
    const txt = inp.value.trim()
    if (!txt) return
    inp.value = ''
    addMsg(txt, 'u')
    const { data, error } = await sb.from(T.mensagens).insert({ texto: txt, owner: OWNER }).select().single()
    if (error) { addMsg('Erro ao enviar: ' + error.message, 'ia'); return }
    const esperaEl = document.createElement('div')
    esperaEl.className = 'espera'
    esperaEl.textContent = 'Aguardando o PC responder...'
    document.getElementById('msgs').appendChild(esperaEl)
    document.getElementById('msgs').scrollTop = 99999
    aguardarResposta(data.id, esperaEl)
  }

  async function aguardarResposta(id, esperaEl) {
    let tentativas = 0
    const intervalo = setInterval(async () => {
      tentativas++
      const { data } = await sb.from(T.mensagens).select('respondida,resposta').eq('id', id).single()
      if (data && data.respondida) {
        clearInterval(intervalo)
        esperaEl.remove()
        addMsg(data.resposta, 'ia')
      }
      if (tentativas > 40) {
        clearInterval(intervalo)
        esperaEl.textContent = 'O PC não respondeu. Ele está ligado e com o Hefesto aberto?'
      }
    }, 3000)
  }

  const ICONE_IA = '<svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'
  const ICONE_USER = '<svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'

  function addMsg(txt, tipo) {
    const c = document.getElementById('msgs')
    const d = document.createElement('div')
    d.className = `m ${tipo}`
    d.innerHTML = `<div class="av">${tipo==='ia'?ICONE_IA:ICONE_USER}</div><div class="mb">${txt.replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</div>`
    c.appendChild(d); c.scrollTop = c.scrollHeight
  }

  document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') enviar() })
  document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') login() })

  const ICONE_CHECK = '<svg class="ic" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'

  async function carregarTarefas() {
    const { data } = await sb.from(T.tarefas).select('*').order('criada', { ascending: false })
    const lst = document.getElementById('lst-tar')
    if (!data || !data.length) { lst.innerHTML = '<div class="vz">Nenhuma tarefa ainda</div>'; return }
    lst.innerHTML = ''
    data.forEach(t => {
      const div = document.createElement('div')
      div.className = `ti${t.concluida ? ' done' : ''}`
      div.innerHTML = `<div class="ck">${t.concluida ? ICONE_CHECK : ''}</div><div class="tt">${t.texto}</div>`
      if (!t.concluida) div.onclick = async () => {
        await sb.from(T.tarefas).update({ concluida: true, concluida_em: new Date().toISOString() }).eq('id', t.id)
        carregarTarefas()
      }
      lst.appendChild(div)
    })
  }

  async function addTar() {
    const inp = document.getElementById('ni-tar')
    const txt = inp.value.trim(); if (!txt) return
    await sb.from(T.tarefas).insert({ texto: txt, owner: OWNER })
    inp.value = ''; carregarTarefas()
  }
  document.getElementById('ni-tar').addEventListener('keydown', e => { if (e.key === 'Enter') addTar() })

  async function carregarNotas() {
    const { data } = await sb.from(T.notas).select('*').order('criada', { ascending: false }).limit(30)
    const lst = document.getElementById('lst-nota')
    if (!data || !data.length) { lst.innerHTML = '<div class="vz">Nenhuma nota ainda</div>'; return }
    lst.innerHTML = ''
    data.forEach(n => {
      const div = document.createElement('div'); div.className = 'ni'
      div.textContent = n.texto
      lst.appendChild(div)
    })
  }

  async function addNota() {
    const inp = document.getElementById('ni-nota')
    const txt = inp.value.trim(); if (!txt) return
    await sb.from(T.notas).insert({ texto: txt, owner: OWNER })
    inp.value = ''; carregarNotas()
  }
  document.getElementById('ni-nota').addEventListener('keydown', e => { if (e.key === 'Enter') addNota() })

  async function buscar() {
    const q = document.getElementById('q-busca').value.trim(); if (!q) return
    const res = document.getElementById('busca-res')
    res.innerHTML = '<div class="vz">Buscando...</div>'
    const { data, error } = await sb.from(T.vault).select('caminho,titulo,conteudo').textSearch('conteudo', q.split(' ').join(' & '), { config: 'portuguese' }).limit(10)
    if (error || !data || !data.length) {
      const { data: data2 } = await sb.from(T.vault).select('caminho,titulo,conteudo').ilike('conteudo', `%${q}%`).limit(10)
      renderBusca(data2, q)
      return
    }
    renderBusca(data, q)
  }

  function renderBusca(data, q) {
    const res = document.getElementById('busca-res')
    if (!data || !data.length) { res.innerHTML = `<div class="vz">Nada encontrado sobre "${q}"</div>`; return }
    res.innerHTML = ''
    data.forEach(r => {
      const idx = r.conteudo.toLowerCase().indexOf(q.toLowerCase())
      const trecho = idx >= 0 ? r.conteudo.slice(Math.max(0, idx - 40), idx + 100) : r.conteudo.slice(0, 100)
      const div = document.createElement('div'); div.className = 'br-item'
      div.innerHTML = `<div class="br-titulo">${r.titulo || r.caminho}</div><div class="br-trecho">${trecho}...</div>`
      res.appendChild(div)
    })
  }
  document.getElementById('q-busca').addEventListener('keydown', e => { if (e.key === 'Enter') buscar() })
</script>
</body>
</html>
